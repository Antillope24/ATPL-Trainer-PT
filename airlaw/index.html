<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no"><link rel="manifest" href="manifest.webmanifest"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Air Law"><link rel="apple-touch-icon" href="icons/icon-180.png"><link rel="icon" href="icons/icon-192.png"><meta name="theme-color" content="#0b6e8f"><style>[hidden]{display:none!important}img{max-width:100%}</style></head><body><title>Air Law Explorer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: top bar with module chips; each module is a view. Airspace module = full-bleed 3D stage + drawer; VMC module = form left, diagram right (stacks on phone) */
:root{
  --bg:#eef2f6; --surface:#ffffff; --surface2:#e9edf3; --fg:#17202b; --muted:#5b6876; --line:#d3dae3; --accent:#0b6e8f; --accent-fg:#fff; --accent-soft:#dcedf3;
  --good:#2a8a52; --bad:#c43f38; --warn:#b7791f; --sky:#dfe9f3;
  --display:"Barlow Semi Condensed","Barlow",system-ui,sans-serif; --body:"Barlow",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f151c;--surface:#18212b;--surface2:#222d39;--fg:#e8edf2;--muted:#93a1b1;--line:#2d3a48;--accent:#4fb3d6;--accent-fg:#0b1218;--accent-soft:#163745;--good:#5ac589;--bad:#ef7b74;--warn:#e4b35a;--sky:#1a2634;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f151c;--surface:#18212b;--surface2:#222d39;--fg:#e8edf2;--muted:#93a1b1;--line:#2d3a48;--accent:#4fb3d6;--accent-fg:#0b1218;--accent-soft:#163745;--good:#5ac589;--bad:#ef7b74;--warn:#e4b35a;--sky:#1a2634;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 var(--body);display:flex;flex-direction:column;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
h1{font-family:var(--display);font-size:1.2rem;margin:0;white-space:nowrap}
h2{font-family:var(--display);font-size:1.5rem;margin:0;line-height:1.15;text-wrap:balance}
h3{font-family:var(--display);font-size:1.15rem;margin:0}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-size:.82em}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));flex:none}
.bar{display:flex;align-items:center;gap:12px;min-height:54px;flex-wrap:wrap;padding-block:6px}
nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1}
nav::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-weight:600;font-size:.88rem;white-space:nowrap;min-height:38px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.chip.soon{opacity:.5}
main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;overflow:auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.view[hidden]{display:none}
.wrap{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0;text-align:left}
.card.link{cursor:pointer}.card.link:hover,.card.link:focus-visible{border-color:var(--accent)}
.card .num{font-family:var(--mono);font-size:.75rem;color:var(--accent)}
.tag{display:inline-block;font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;padding:3px 8px;border-radius:999px;background:var(--surface2);color:var(--muted)}
.btn{background:var(--accent);color:var(--accent-fg);border:0;border-radius:8px;padding:10px 14px;font-weight:600;min-height:42px}
.btn-s{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-weight:600;font-size:.88rem;min-height:40px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:8px 14px;font-weight:600;color:var(--muted);min-height:40px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
/* 3D */
#v-air{padding:0;overflow:hidden}
#stage{position:absolute;inset:0;touch-action:none}
canvas{display:block}
.top{position:absolute;top:10px;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;gap:8px;align-items:center;flex-wrap:wrap;pointer-events:none}
.top>*{pointer-events:auto}
.pill{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 6px;box-shadow:0 4px 14px rgba(0,0,0,.12);display:flex;gap:4px;align-items:center}
.views{display:flex;gap:4px;overflow-x:auto;max-width:100%;scrollbar-width:none}
.views::-webkit-scrollbar{display:none}
.drawer{position:absolute;top:64px;bottom:12px;right:max(12px,env(safe-area-inset-right,0px));width:min(400px,calc(100vw - 24px));background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.18);display:flex;flex-direction:column;overflow:hidden;transition:transform .25s}
.drawer.closed{transform:translateX(calc(100% + 24px))}
.drawer .head{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.drawer .head .tabs{display:flex;gap:4px;flex:1;overflow-x:auto;scrollbar-width:none}
.drawer .body{overflow:auto;padding:14px;display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch}
.fab{position:absolute;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--accent);color:var(--accent-fg);border:0;border-radius:999px;padding:12px 18px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.25);display:none}
.drawer.closed ~ .fab{display:block}
@media (max-width:760px){.drawer{top:auto;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));width:auto;height:55%;bottom:calc(10px + env(safe-area-inset-bottom,0px))}.drawer.closed{transform:translateY(calc(100% + 24px))}}
.zones{display:flex;flex-direction:column;gap:6px}
.zone{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);text-align:left;min-height:44px}
.zone.sel{border-color:var(--accent);background:var(--surface2)}
.zone .n{flex:1;min-width:0;font-weight:600;line-height:1.2}
.zone .cls{font-family:var(--mono);font-size:.75rem;color:var(--muted)}
.zone .eye{border:0;background:none;color:var(--muted);font-size:1rem;padding:6px}
.zone .eye[aria-pressed="false"]{opacity:.35}
.sw{width:16px;height:16px;border-radius:4px;border:1px solid rgba(0,0,0,.2);flex:none}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:8px 12px;font-size:.93rem}
dt{color:var(--muted);font-weight:500}
dd{margin:0}
.hint{font-size:.82rem;color:var(--muted)}
.tip{position:absolute;pointer-events:none;background:var(--fg);color:var(--bg);padding:4px 8px;border-radius:6px;font-size:.8rem;transform:translate(-50%,-130%);white-space:nowrap;opacity:0;transition:opacity .15s}
/* tables */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.82rem}
.cmp td,.cmp th{padding:6px 8px;min-width:120px}
.cmp td:first-child{min-width:110px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);position:sticky;top:0;background:var(--surface)}
tr.hl td{background:var(--accent-soft)}
td.c{font-family:var(--display);font-weight:700;font-size:1.1rem}
.cmp td:first-child{position:sticky;left:0;background:var(--surface);font-weight:600}
/* flight levels */
.flgrid{display:grid;grid-template-columns:minmax(260px,1fr) minmax(300px,1.3fr);gap:16px;align-items:start}

.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:.9rem}
.compass{width:100%;max-width:280px;align-self:center;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.compass .half{fill:var(--surface2);transition:fill .2s}

.needle line{stroke:var(--fg)}.needle path,.needle circle{fill:var(--bad)}
.flhead{border-left:4px solid var(--accent);padding-left:12px}.flhead.w{border-color:var(--warn)}
.flhead.e .big{color:var(--accent)}.flhead.w .big{color:var(--warn)}
.flrow{display:flex;flex-direction:column;gap:4px}
.flchips{display:flex;flex-wrap:wrap;gap:5px}
.fl{font-family:var(--mono);font-size:.78rem;font-weight:600;padding:4px 8px;border-radius:6px;background:var(--surface2);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.ladder{width:100%;max-width:380px;align-self:center}
.rung{stroke:var(--muted);opacity:.3}.rung.e.on{stroke:var(--accent);opacity:1}.rung.w.on{stroke:var(--warn);opacity:1}
.band{fill:var(--accent);opacity:.1}.bandt{fill:var(--muted);font-weight:600}
.bul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:.93rem;font-weight:400}
.chk{display:flex;gap:8px;align-items:center;font-weight:600;font-size:.9rem}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
.big.acc{color:var(--accent)}
#fl .res{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}#fl .res .big{font-size:1.6rem}#fl .res .eyebrow{overflow-wrap:anywhere}
#fl .seg{align-self:flex-start}
.fqq{font-size:1.1rem;font-weight:600}
.fqopts{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.fqopts .btn-s{font-family:var(--mono);min-height:46px}
.fqopts .good{background:var(--good);color:#fff;border-color:var(--good);opacity:1}
.fqopts .bad{background:var(--bad);color:#fff;border-color:var(--bad);opacity:1}

.vmc{display:grid;grid-template-columns:minmax(260px,1fr) minmax(300px,1.4fr);gap:16px}
@media (max-width:760px){.vmc{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:.9rem}
select,input[type=number]{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);min-height:42px}
input[type=range]{width:100%}
.big{font-family:var(--display);font-size:2.2rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.res{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.res .card{gap:4px}
.ok{color:var(--good)}.no{color:var(--bad)}
svg text{font-family:var(--body)}
</style>
<header><div class="bar">
  <h1 id="h-title">Air Law Explorer</h1>
  <nav id="nav"></nav>
  <select id="lang" class="chip" aria-label="Language"></select>
</div></header>
<main>
  <section class="view" id="v-home"><div class="wrap" id="home"></div></section>

      <div class="views" id="views"></div>
    </div>
    <div class="drawer" id="drawer">
      <div class="head"><div class="tabs"><button class="chip" id="tab-list" aria-pressed="true"></button><button class="chip" id="tab-info" aria-pressed="false"></button><button class="chip" id="tab-cmp" aria-pressed="false"></button><button class="chip" id="tab-help" aria-pressed="false"></button></div><button class="btn-s" id="btn-close">✕</button></div>
      <div class="body" id="body"></div>
    </div>
    <button class="fab" id="fab"></button>
  </section>
  <section class="view" id="v-vmc" hidden><div class="wrap" id="vmc"></div></section>
  <section class="view" id="v-fl" hidden><div class="wrap" id="fl"></div></section>
  <section class="view" id="v-soon" hidden><div class="wrap" id="soon"></div></section>
</main>
