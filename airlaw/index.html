<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no"><link rel="manifest" href="manifest.webmanifest"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Air Law"><link rel="apple-touch-icon" href="icons/icon-180.png"><link rel="icon" href="icons/icon-192.png"><meta name="theme-color" content="#0b6e8f"><style>[hidden]{display:none!important}img{max-width:100%}</style></head><body><title>Air Law Explorer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: top bar with module chips; each module is a view. Airspace module = full-bleed 3D stage + drawer; VMC module = form left, diagram right (stacks on phone) */
:root{
  --bg:#eef2f6; --surface:#ffffff; --surface2:#e9edf3; --fg:#17202b; --muted:#5b6876; --line:#d3dae3; --accent:#0b6e8f; --accent-fg:#fff; --accent-soft:#dcedf3;
  --good:#2a8a52; --bad:#c43f38; --warn:#b7791f; --sky:#dfe9f3;
  --display:"Barlow Semi Condensed","Barlow",system-ui,sans-serif; --body:"Barlow",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f151c;--surface:#18212b;--surface2:#222d39;--fg:#e8edf2;--muted:#93a1b1;--line:#2d3a48;--accent:#4fb3d6;--accent-fg:#0b1218;--accent-soft:#163745;--good:#5ac589;--bad:#ef7b74;--warn:#e4b35a;--sky:#1a2634;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f151c;--surface:#18212b;--surface2:#222d39;--fg:#e8edf2;--muted:#93a1b1;--line:#2d3a48;--accent:#4fb3d6;--accent-fg:#0b1218;--accent-soft:#163745;--good:#5ac589;--bad:#ef7b74;--warn:#e4b35a;--sky:#1a2634;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 var(--body);display:flex;flex-direction:column;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
h1{font-family:var(--display);font-size:1.2rem;margin:0;white-space:nowrap}
h2{font-family:var(--display);font-size:1.5rem;margin:0;line-height:1.15;text-wrap:balance}
h3{font-family:var(--display);font-size:1.15rem;margin:0}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-size:.82em}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));flex:none}
.bar{display:flex;align-items:center;gap:12px;min-height:54px;flex-wrap:wrap;padding-block:6px}
nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1}
nav::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-weight:600;font-size:.88rem;white-space:nowrap;min-height:38px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.chip.soon{opacity:.5}
main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;overflow:auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.view[hidden]{display:none}
.wrap{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0;text-align:left}
.card.link{cursor:pointer}.card.link:hover,.card.link:focus-visible{border-color:var(--accent)}
.card .num{font-family:var(--mono);font-size:.75rem;color:var(--accent)}
.tag{display:inline-block;font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;padding:3px 8px;border-radius:999px;background:var(--surface2);color:var(--muted)}
.btn{background:var(--accent);color:var(--accent-fg);border:0;border-radius:8px;padding:10px 14px;font-weight:600;min-height:42px}
.btn-s{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-weight:600;font-size:.88rem;min-height:40px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:8px 14px;font-weight:600;color:var(--muted);min-height:40px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
/* 3D */
#v-air{padding:0;overflow:hidden}
#stage{position:absolute;inset:0;touch-action:none}
canvas{display:block}
.top{position:absolute;top:10px;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;gap:8px;align-items:center;flex-wrap:wrap;pointer-events:none}
.top>*{pointer-events:auto}
.pill{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 6px;box-shadow:0 4px 14px rgba(0,0,0,.12);display:flex;gap:4px;align-items:center}
.views{display:flex;gap:4px;overflow-x:auto;max-width:100%;scrollbar-width:none}
.views::-webkit-scrollbar{display:none}
.drawer{position:absolute;top:64px;bottom:12px;right:max(12px,env(safe-area-inset-right,0px));width:min(400px,calc(100vw - 24px));background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.18);display:flex;flex-direction:column;overflow:hidden;transition:transform .25s}
.drawer.closed{transform:translateX(calc(100% + 24px))}
.drawer .head{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.drawer .head .tabs{display:flex;gap:4px;flex:1;overflow-x:auto;scrollbar-width:none}
.drawer .body{overflow:auto;padding:14px;display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch}
.fab{position:absolute;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--accent);color:var(--accent-fg);border:0;border-radius:999px;padding:12px 18px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.25);display:none}
.drawer.closed ~ .fab{display:block}
@media (max-width:760px){.drawer{top:auto;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));width:auto;height:55%;bottom:calc(10px + env(safe-area-inset-bottom,0px))}.drawer.closed{transform:translateY(calc(100% + 24px))}}
.zones{display:flex;flex-direction:column;gap:6px}
.zone{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);text-align:left;min-height:44px}
.zone.sel{border-color:var(--accent);background:var(--surface2)}
.zone .n{flex:1;min-width:0;font-weight:600;line-height:1.2}
.zone .cls{font-family:var(--mono);font-size:.75rem;color:var(--muted)}
.zone .eye{border:0;background:none;color:var(--muted);font-size:1rem;padding:6px}
.zone .eye[aria-pressed="false"]{opacity:.35}
.sw{width:16px;height:16px;border-radius:4px;border:1px solid rgba(0,0,0,.2);flex:none}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:8px 12px;font-size:.93rem}
dt{color:var(--muted);font-weight:500}
dd{margin:0}
.hint{font-size:.82rem;color:var(--muted)}
.tip{position:absolute;pointer-events:none;background:var(--fg);color:var(--bg);padding:4px 8px;border-radius:6px;font-size:.8rem;transform:translate(-50%,-130%);white-space:nowrap;opacity:0;transition:opacity .15s}
/* tables */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.82rem}
.cmp td,.cmp th{padding:6px 8px;min-width:120px}
.cmp td:first-child{min-width:110px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);position:sticky;top:0;background:var(--surface)}
tr.hl td{background:var(--accent-soft)}
td.c{font-family:var(--display);font-weight:700;font-size:1.1rem}
.cmp td:first-child{position:sticky;left:0;background:var(--surface);font-weight:600}
/* flight levels */
.flgrid{display:grid;grid-template-columns:minmax(260px,1fr) minmax(300px,1.3fr);gap:16px;align-items:start}
@media (max-width:760px){.flgrid{grid-template-columns:1fr}}
.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:.9rem}
.compass{width:100%;max-width:280px;align-self:center;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.compass .half{fill:var(--surface2);transition:fill .2s}
.compass .half.e.on{fill:var(--accent-soft)}.compass .half.w.on{fill:color-mix(in srgb,var(--warn) 22%,var(--surface))}
.lbl{fill:var(--muted);opacity:.55;transition:opacity .2s}.lbl.on{opacity:1}.lbl.e.on{fill:var(--accent)}.lbl.w.on{fill:var(--warn)}
.needle line{stroke:var(--fg)}.needle path,.needle circle{fill:var(--bad)}
.flhead{border-left:4px solid var(--accent);padding-left:12px}.flhead.w{border-color:var(--warn)}
.flhead.e .big{color:var(--accent)}.flhead.w .big{color:var(--warn)}
.flrow{display:flex;flex-direction:column;gap:4px}
.flchips{display:flex;flex-wrap:wrap;gap:5px}
.fl{font-family:var(--mono);font-size:.78rem;font-weight:600;padding:4px 8px;border-radius:6px;background:var(--surface2);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.ladder{width:100%;max-width:380px;align-self:center}
.rung{stroke:var(--muted);opacity:.3}.rung.e.on{stroke:var(--accent);opacity:1}.rung.w.on{stroke:var(--warn);opacity:1}
.band{fill:var(--accent);opacity:.1}.bandt{fill:var(--muted);font-weight:600}
.bul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:.93rem;font-weight:400}
.chk{display:flex;gap:8px;align-items:center;font-weight:600;font-size:.9rem}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
.big.acc{color:var(--accent)}
#fl .res{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}#fl .res .big{font-size:1.6rem}#fl .res .eyebrow{overflow-wrap:anywhere}
#fl .seg{align-self:flex-start}
.fqq{font-size:1.1rem;font-weight:600}
.fqopts{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.fqopts .btn-s{font-family:var(--mono);min-height:46px}
.fqopts .good{background:var(--good);color:#fff;border-color:var(--good);opacity:1}
.fqopts .bad{background:var(--bad);color:#fff;border-color:var(--bad);opacity:1}
/* vmc */
.vmc{display:grid;grid-template-columns:minmax(260px,1fr) minmax(300px,1.4fr);gap:16px}
@media (max-width:760px){.vmc{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:.9rem}
select,input[type=number]{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);min-height:42px}
input[type=range]{width:100%}
.big{font-family:var(--display);font-size:2.2rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.res{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.res .card{gap:4px}
.ok{color:var(--good)}.no{color:var(--bad)}
svg text{font-family:var(--body)}
.altgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.altform{display:grid;grid-template-columns:1fr 1fr;gap:12px 24px}
.altcol{display:flex;flex-direction:column;gap:12px;min-width:0}
@media(max-width:720px){.altgrid,.altform{grid-template-columns:1fr}}
.altsvg{width:100%;height:auto;display:block}
.alts{border-radius:10px}
.adial{max-width:360px;margin:0 auto;touch-action:none;outline-offset:3px}
.apfd{max-width:240px;margin:0 auto}
.knob{cursor:grab;touch-action:none}
.knob:active{cursor:grabbing}
.lgd{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.85rem}
.lgd i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.btn-s[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.qtext{white-space:pre-line;font-size:1.02rem;line-height:1.55;margin:4px 0}
.qlist{display:flex;flex-direction:column;gap:8px}
.qopt{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);font:inherit;cursor:pointer}
.qopt:hover:not(:disabled){border-color:var(--accent)}
.qopt b{min-width:1.1em;color:var(--muted)}
.qopt:disabled{cursor:default;opacity:.75}
.qopt.ok{border-color:var(--good);border-width:2px;opacity:1;color:var(--fg);background:color-mix(in srgb,var(--good) 12%,var(--surface))}
.qopt.no{border-color:var(--bad);border-width:2px;opacity:1;color:var(--fg);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.qexp{line-height:1.55}

.numrow{display:flex;align-items:center;gap:8px}.numrow>span:first-child{flex:1}
.numin{width:84px;font:inherit;font-variant-numeric:tabular-nums;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);text-align:right}
.hstage{position:relative;width:100%;height:min(420px,55vh);border-radius:12px;overflow:hidden;background:var(--sky);border:1px solid var(--line);touch-action:none}
.hstage canvas{display:block}
.vmode{position:fixed;inset:0;z-index:40;background:var(--sky)}
.vmode[hidden]{display:none}
.vmode .vst{position:absolute;inset:0;height:auto;border:0;border-radius:0}
.vhud{position:absolute;top:max(12px,env(safe-area-inset-top,0px));left:16px;right:16px;font:600 clamp(14px,1.6vw,20px)/1.3 var(--display);color:var(--fg);background:rgba(255,255,255,.85);border-radius:10px;padding:8px 14px;pointer-events:none;width:max-content;max-width:calc(100% - 32px)}
:root[data-theme="dark"] .vhud{background:rgba(24,33,43,.85)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .vhud{background:rgba(24,33,43,.85)}}
.vcap{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(112px + env(safe-area-inset-bottom,0px));width:min(1100px,calc(100% - 32px));background:rgba(23,32,43,.88);color:#fff;border-radius:14px;padding:16px 22px;font:500 clamp(18px,2.4vw,30px)/1.3 var(--body);pointer-events:none;text-wrap:pretty}
.vcap .vnum{display:block;font:700 .55em/1 var(--display);letter-spacing:.08em;text-transform:uppercase;color:#9fd8ea;margin-bottom:8px}
.vbar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:calc(100% - 24px);opacity:0;transition:opacity .25s;pointer-events:none}
.vbar.show{opacity:1;pointer-events:auto}
body.video-on header,body.video-on main{visibility:hidden}

</style>
<header><div class="bar">
  <h1 id="h-title">Air Law Explorer</h1>
  <nav id="nav"></nav>
  <select id="lang" class="chip" aria-label="Language"></select>
</div></header>
<main>
  <section class="view" id="v-home"><div class="wrap" id="home"></div></section>
  <section class="view" id="v-air" hidden>
    <div id="stage"></div><div class="tip" id="tip"></div>
    <div class="top">
      <div class="pill seg" id="mode"><button aria-pressed="true" data-m="de"></button><button aria-pressed="false" data-m="icao"></button></div>
      <div class="views" id="views"></div>
    </div>
    <div class="drawer" id="drawer">
      <div class="head"><div class="tabs"><button class="chip" id="tab-list" aria-pressed="true"></button><button class="chip" id="tab-info" aria-pressed="false"></button><button class="chip" id="tab-cmp" aria-pressed="false"></button><button class="chip" id="tab-help" aria-pressed="false"></button></div><button class="btn-s" id="btn-close">✕</button></div>
      <div class="body" id="body"></div>
    </div>
    <button class="fab" id="fab"></button>
  </section>
  <section class="view" id="v-vmc" hidden><div class="wrap" id="vmc"></div></section>
  <section class="view" id="v-fl" hidden><div class="wrap" id="fl"></div></section>
  <section class="view" id="v-hold" hidden><div class="wrap" id="hold"></div></section>
  <section class="view" id="v-alt" hidden><div class="wrap" id="alt"></div></section>
  <section class="view" id="v-soon" hidden><div class="wrap" id="soon"></div></section>
</main>

const AC3D_CACHE = {};
function loadAC3D(url) {

    const dv = new DataView(buf); const hl = dv.getUint32(4, true); const hdr = JSON.parse(new TextDecoder().decode(new Uint8Array(buf, 8, hl)));

    const nrm = new Int8Array(buf, off, hdr.vcount * 4); off += hdr.vcount * 4;
    const idx = new Uint32Array(buf, off, hdr.icount);
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    g.setAttribute('normal', new THREE.BufferAttribute(nrm, 4, true));
    g.setIndex(new THREE.BufferAttribute(idx, 1));
    const mats = hdr.groups.map((gr, i) => { g.addGroup(gr.start, gr.count, i); const m = new THREE.MeshPhongMaterial({color: new THREE.Color(...gr.color), shininess: 60, specular: 0x555555, side: THREE.DoubleSide}); if (gr.opacity < 1) { m.transparent = true; m.opacity = gr.opacity; } return m; });
    return {geometry: g, materials: mats, hdr};
  });

}

    const mesh = new THREE.Mesh(geometry, mats); if (opts.rotY) mesh.rotation.y = opts.rotY; g.add(mesh); if (opts.onload) opts.onload(mesh);

/* ---------- Video Modus ---------- */
const VM = {el: null, cap: null, bar: null, hud: null, timer: 0};
function openVideo() {
  if (!h3dInit()) return;
  if (!VM.el) {
    const v = el('div', 'vmode'); v.id = 'vmode';
    const st = el('div', 'hstage vst'); st.id = 'hstage-video';
    const hud = el('div', 'vhud'); const cap = el('div', 'vcap'); const bar = el('div', 'vbar');
    v.append(st, hud, cap, bar); document.body.append(v); VM.el = v; VM.cap = cap; VM.bar = bar; VM.hud = hud;
    let down = null;
    st.addEventListener('pointerdown', e => { down = [e.clientX, e.clientY]; });
    st.addEventListener('pointerup', e => { if (down && Math.hypot(e.clientX - down[0], e.clientY - down[1]) < 8) showBar(); down = null; });
    v.addEventListener('pointermove', () => { if (matchMedia('(pointer:fine)').matches) showBar(); });
  }
  H3.video = true; document.body.classList.add('video-on'); VM.el.hidden = false;
  h3dMount($('#hstage-video')); h3dReset(); H3.playing = true; renderBar(); videoCaption(); showBar();
  window.addEventListener('keydown', videoKeys);
  if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
}
function closeVideo() {
  H3.video = false; document.body.classList.remove('video-on'); VM.el.hidden = true; window.removeEventListener('keydown', videoKeys);
  if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(() => {});
  h3dMount();
}
function videoKeys(e) {
  if (e.key === 'Escape') closeVideo(); else if (e.key === ' ') { e.preventDefault(); H3.playing = !H3.playing; renderBar(); }
  else if (e.key === 'ArrowRight') { H3.auto = false; H3.step = Math.min(8, H3.step + 1); videoCaption(); renderBar(); }
  else if (e.key === 'ArrowLeft') { H3.auto = false; H3.step = Math.max(0, H3.step - 1); videoCaption(); renderBar(); }
}
function showBar() { VM.bar.classList.add('show'); clearTimeout(VM.timer); VM.timer = setTimeout(() => VM.bar.classList.remove('show'), 4000); }
function renderBar() {
  const b = VM.bar; b.innerHTML = '';
  const tb = (txt, fn, on) => { const x = btn(txt, () => { fn(); renderBar(); showBar(); }, 'chip'); if (on != null) x.setAttribute('aria-pressed', String(on)); return x; };
  b.append(tb(H3.playing ? '❚❚ ' + HT('pause') : '▶ ' + HT('play'), () => { H3.playing = !H3.playing; }),
    tb('↺ ' + HT('restart'), () => h3dReset()),
    tb('◀ ' + HT('step'), () => { H3.auto = false; H3.step = Math.max(0, H3.step - 1); videoCaption(); }),
    tb(HT('step') + ' ▶', () => { H3.auto = false; H3.step = Math.min(8, H3.step + 1); videoCaption(); }),
    tb(HT('auto'), () => { H3.auto = !H3.auto; }, H3.auto),
    tb(HT('speed') + ' ' + H3.speed + '×', () => { H3.speed = H3.speed >= 2 ? .5 : H3.speed + .5; }),
    tb(HT('follow'), () => { H3.follow = !H3.follow; if (H3.follow) H3.topView = false; else h3dHome(); }, H3.follow),
    tb(HT('top'), () => { H3.topView = !H3.topView; H3.follow = false; if (H3.topView) { const c = H3.center || new THREE.Vector3(); H3.cam.position.set(c.x, 420, c.z + 0.1); H3.ctl.target.set(c.x, 0, c.z); } else h3dHome(); }, H3.topView),
    tb(HT('plane') + ': ' + HT(H3.planeType), () => { H3.planeType = PLANE_TYPES[(PLANE_TYPES.indexOf(H3.planeType) + 1) % PLANE_TYPES.length]; h3dBuild(); }),
    tb('✕ ' + HT('exit'), () => closeVideo()));
}
function videoSync() {
  const P = H3.path; if (!P) return;
  const ph = h3dPhase(); const d = H3.dist;
  if (H3.auto) {
    let st;
    if (ph === 'approach') st = Math.min(2, Math.floor(d / P.dApproach * 3));
    else if (ph === 'entry') st = 3;
    else { const loopLen = P.dLoop - P.dEntry; const k = (d - P.dEntry) / loopLen; st = k < 1 ? 4 + Math.min(2, Math.floor(k * 3)) : k < 2 ? 7 : 8; }
    if (st !== H3.step) { H3.step = st; videoCaption(); }
  }
  const r = holdCalc();
  VM.hud.textContent = `${HT(ph === 'approach' ? 'phApproach' : ph === 'entry' ? 'phEntry' : 'phHold')}  ·  ${HT(r.entry)}  ·  IB ${pad3(r.ibh)}°  OB ${pad3(r.obh)}°  ${r.tout} s  ·  ${hs.dir === 'R' ? HT('right').split(' ')[0] : HT('left')}`;
}
function videoCaption() {
  const steps = holdSteps(holdCalc()); VM.cap.innerHTML = '';
  VM.cap.append(el('span', 'vnum', `${HT('step')} ${H3.step + 1} / 9`), el('div', '', steps[H3.step]));
}

    const W = 'It is warmer than ISA.', C = 'It is colder than ISA.', S = 'Its average temperature is the same as ISA.', cor = ta > ex ? W : ta < ex ? C : S;
    const iaq = fl * 100 - (HPA0 - Q) * fp;
    return mkTask('temp', `During a flight over the sea at FL${fl}, the true altitude is ${ta} feet; local QNH is ${Q} hPa. What information, if any, can be gained about the air mass in which the aircraft is flying?`,
      cor, [W, C, S, 'There is insufficient information to make any assumption.'],
      `In the ISA, FL${fl} with QNH ${Q} would be at ${fl * 100} ${pm((Q - 1013) * fp)} = ${ex} ft true altitude (QNH ${Q > 1013 ? 'above 1013 lifts' : Q < 1013 ? 'below 1013 lowers' : '1013 leaves'} the pressure surfaces). The real true altitude is ${ta} ft, ${ta > ex ? 'higher: warm air stretches the column' : ta < ex ? 'lower: cold air shrinks the column' : 'exactly that: ISA temperature on average'}. Hot is high, cold is low.`,
      {elev: 0, qnh: Q, set: HPA0, ta, dev: Math.max(-40, Math.min(40, Math.round((ta / iaq - 1) / 0.004))), fp}); },
  tempInd: () => { const elev = rint(0, 20) * 50, IA = elev + rint(5, 40) * 100, mo = pickA(['warm', 'cold', 'warm', 'cold', 'isa']), dev = mo === 'warm' ? 20 : mo === 'cold' ? -20 : 0;
    const Ls = `True altitude is less than ${IA} feet.`, Eq = `True altitude is equal to ${IA} feet.`, Mo = `True altitude is more than ${IA} feet.`, cor = mo === 'warm' ? Mo : mo === 'cold' ? Ls : Eq;
    return mkTask('temp', `An aircraft is flying over an aerodrome with an indicated altitude of ${IA} ft. The aerodrome elevation is ${elev} ft AMSL. The altimeter is correctly set to the aerodrome QNH, and the outside air temperature is ${mo === 'warm' ? 'significantly higher than ISA' : mo === 'cold' ? 'significantly lower than ISA' : 'equal to ISA'}. What can be said about the aircraft's true altitude?`,
      cor, [Ls, Eq, Mo, elev > 0 ? `True altitude is ${IA - elev} feet.` : 'True altitude cannot be determined without the QFE.'],
      `The altimeter is calibrated for ISA. ${mo === 'warm' ? 'Warm air: the pressure levels are further apart, the aircraft is higher than indicated.' : mo === 'cold' ? 'Cold air: the pressure levels are closer together, the aircraft is lower than indicated. Cold air, fly higher, beware.' : 'ISA temperature: indicated equals true altitude.'} ${elev > 0 ? `${IA - elev} ft would be the height above the aerodrome, not the altitude.` : ''}`,
      {elev, qnh: HPA0, set: HPA0, ta: Math.round(elev + (IA - elev) * (1 + 0.004 * dev)), dev, fp: 30}); },
  mufl: () => { const fp = 30, ob = rint(300, 1300) * 10, dev = pickA([-25, -20, -15, -10, -5, 0]), Q = rint(975, 1030), och = pickA([1000, 2000]), req = ob + och, tc = Math.round(0.004 * Math.max(0, -dev) * req), qa = req + tc, pq = (1013 - Q) * fp, pa = qa + pq, up = v => Math.ceil(v / 1000 - 1e-9) * 10, fl = up(pa);
    return mkTask('mufl', `Determine the appropriate minimum flight level to use, given the following information:\n\nObstacle elevation: ${ob} ft\nISA deviation: ${dev}°C\nAmbient pressure (QNH): ${Q} hPa\nObstacle clearance height (OCH): ${och} ft\n\n(Assume ${fp} ft/hPa and 4 ft per 1000 ft per °C. Round up to the next full thousand feet.)`,
      fL(fl), [fL(up(req + pq)), fL(up(qa - pq)), fL(fl - 10), fL(fl + 10), fL(fl + 20), fL(fl - 20)],
      `1) Required true altitude: ${ob} + ${och} = ${req} ft. 2) Cold correction: 4 × ${Math.max(0, -dev)} × ${(req / 1000).toFixed(2)} = ${tc} ft → ${qa} ft on QNH. 3) To standard: (1013 − ${Q}) × ${fp} = ${pq} ft → pressure altitude ${pa} ft. 4) Round up: FL${fl}. Low QNH and cold air both push the MUFL up.`,
      {elev: 0, ter: ob, clr: och, dev, qnh: Q, set: HPA0, ta: Math.round((fl * 100 - (HPA0 - Q) * fp) * (1 + 0.004 * dev)), rnd: 1000, fp}); },
  pressNum: () => { const fp = 30, qnh = rint(990, 1030), d = rint(5, 20) * (Math.random() < .5 ? -1 : 1), set = qnh + d, ia = rint(20, 90) * 100, ans = ia - d * fp;
    return mkTask('press', `The actual QNH is ${qnh} hPa, but ${set} hPa is set on the subscale. The altimeter reads ${ia} ft. What is the true altitude? (ISA conditions, ${fp} ft/hPa)`,
      fF(ans), [fF(ia + d * fp), fF(ia), fF(ia - d * fp * 2), fF(ia - d * 10)],
      `Subscale ${Math.abs(d)} hPa too ${d > 0 ? 'high: the altimeter over-reads by' : 'low: the altimeter under-reads by'} ${Math.abs(d) * fp} ft. True altitude = ${ia} ${pm(-d * fp)} = ${ans} ft. Set high, reads high, but you are low.`,
      {elev: 0, qnh, set, ta: ans, dev: 0, fp}); },
  tempNum: () => { const dev = pickA([-30, -25, -20, -15, -10, 10, 15, 20]), ia = rint(3, 12) * 1000, tc = Math.round(0.004 * dev * ia), ans = ia + tc;
    return mkTask('temp', `QNH is set, the aerodrome is at sea level. The altimeter reads ${ia} ft, the temperature is ISA ${dev > 0 ? '+' : ''}${dev}°C. What is the approximate true altitude? (4 ft per 1000 ft per °C)`,
      fF(ans), [fF(ia - tc), fF(ia), fF(ia + Math.round(tc / 2)), fF(ia + tc * 2)],
      `Correction = 4 × ${dev} × ${ia / 1000} = ${tc} ft. True altitude = ${ia} ${pm(tc)} = ${ans} ft. ${dev < 0 ? 'Cold: lower than indicated.' : 'Warm: higher than indicated.'}`,
      {elev: 0, qnh: HPA0, set: HPA0, ta: ans, dev, fp: 30}); }
};
const QTOP = {press: ['standby', 'qfe2qnh', 'hill', 'trans', 'landing', 'pressNum'], temp: ['isaLevel', 'ftPerHpa', 'airmass', 'tempInd', 'tempNum'], mufl: ['mufl'], wind: ['wind']};

  box.append(list);

    const row = el('div', 'row'); row.style.flexWrap = 'wrap'; row.append(btn(AT('next') + ' ▶', () => { AS.quiz = altQuizNew(); AS.pick = null; renderAltQuiz(); AF.quiz.scrollIntoView({block: 'start', behavior: 'smooth'}); }, 'btn'));
    if (Q.sim) row.append(btn(AT('simBtn'), () => { const keep = {quiz: AS.quiz, pick: AS.pick}; Object.assign(AS, {ter: AS.ter, clr: AS.clr}, Q.sim, keep); renderAlt(); setTimeout(() => AF.dial.svg.closest('.altgrid').scrollIntoView({behavior: 'smooth', block: 'start'}), 50); }, 'btn-s'));
    box.append(row); } else box.append(el('div', 'hint', AT('pick')));
  box.append(el('div', 'hint', `${AT('score')}: ${AS.score[0]} / ${AS.score[1]}`));
}
