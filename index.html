<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="manifest" href="manifest.webmanifest"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="ATPL Trainer"><link rel="apple-touch-icon" href="icons/icon-180.png"><link rel="icon" href="icons/icon-192.png"><meta name="theme-color" content="#0b6e8f"><style>[hidden]{display:none!important}img{max-width:100%}</style></head><body><title>ATPL Progress Trainer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one-screen app, sticky top bar with mode tabs, content column max 860px, exam navigator as bubble grid */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --surface2:#e9edf3; --fg:#17202b; --muted:#5b6876; --line:#d3dae3;

  --display:"Barlow Semi Condensed","Barlow",system-ui,sans-serif; --body:"Barlow",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f151c; --surface:#18212b; --surface2:#222d39; --fg:#e8edf2; --muted:#93a1b1; --line:#2d3a48;
  --accent:#4fb3d6; --accent-fg:#0b1218; --accent-soft:#163745;
  --good:#5ac589; --good-soft:#163a27; --bad:#ef7b74; --bad-soft:#44201e; --warn:#e4b35a; --warn-soft:#3e2f12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151c; --surface:#18212b; --surface2:#222d39; --fg:#e8edf2; --muted:#93a1b1; --line:#2d3a48;
  --accent:#4fb3d6; --accent-fg:#0b1218; --accent-soft:#163745;
  --good:#5ac589; --good-soft:#163a27; --bad:#ef7b74; --bad-soft:#44201e; --warn:#e4b35a; --warn-soft:#3e2f12; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 var(--body);display:flex;flex-direction:column}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:1.35rem;font-weight:700}
h2{font-size:1.5rem;font-weight:700}
h3{font-size:1.15rem;font-weight:600}
.mono{font-family:var(--mono);font-size:.82em;letter-spacing:.02em}
.eyebrow{font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line);padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:12px;min-height:54px;flex-wrap:wrap}
.bar h1{flex:1;min-width:0;white-space:nowrap}
@media (max-width:560px){.bar h1{font-size:1.1rem;flex:1 1 100%}.bar h1 small{display:none}.bar{gap:4px 8px;padding-block:6px}nav{width:100%;justify-content:flex-end}nav button{padding:6px 9px}}
.bar h1 small{font-family:var(--mono);font-weight:500;font-size:.7rem;color:var(--muted);margin-left:8px}
nav{display:flex;gap:4px}
nav button{background:none;border:0;padding:8px 12px;border-radius:8px;font-weight:600;color:var(--muted)}
nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.themebtn{display:inline-flex;align-items:center;justify-content:center;line-height:1;min-width:36px;border:1px solid var(--line)!important;background:var(--surface)!important;padding:6px 8px!important}
.langsel{font:inherit;font-weight:600;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px;margin-left:4px}

main{flex:1;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.sync{font-size:.78rem;color:var(--muted);display:flex;align-items:center;gap:6px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}

.card.btn:hover{border-color:var(--accent)}
.card .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card .code{font-family:var(--mono);font-size:.8rem;color:var(--accent);font-weight:500}
.meter{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden;display:flex}
.meter b{display:block;height:100%;background:var(--good)}
.meter i{display:block;height:100%;background:var(--accent)}
.stats{display:flex;gap:14px;font-size:.82rem;color:var(--muted);flex-wrap:wrap}
.stats strong{color:var(--fg);font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn-p,.btn-s,.btn-g{border-radius:8px;padding:10px 16px;font-weight:600;border:1px solid transparent}
.btn-p{background:var(--accent);color:var(--accent-fg)}

.btn-g{background:none;color:var(--muted)}
.btn-p:disabled,.btn-s:disabled{opacity:.45;cursor:not-allowed}
.pt-list{display:flex;flex-direction:column;gap:10px}
.pt{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px;display:grid;grid-template-columns:1fr auto;gap:8px 14px;align-items:center}
.pt .info{min-width:0}
.pt .info .name{font-family:var(--display);font-weight:600;font-size:1.1rem}
.pt .acts{display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:520px){.pt{grid-template-columns:1fr}}
.q{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:14px}
.q .head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.q .text{font-size:1.12rem;line-height:1.45;max-width:65ch}
.q .img{background:var(--warn-soft);color:var(--fg);border-radius:8px;padding:8px 12px;font-size:.88rem}
.notewrap{display:flex;flex-direction:column;gap:10px}
.qnote{background:var(--warn-soft);color:var(--fg);border-radius:8px;padding:8px 12px;font-size:.88rem}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);text-align:left;width:100%;line-height:1.4}
.opt .l{font-family:var(--mono);font-size:.8rem;color:var(--muted);min-width:1.4em;padding-top:.2em}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.miss{border-color:var(--good);border-style:dashed}
.opt[disabled]{cursor:default}
.tag{display:inline-block;font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;padding:3px 8px;border-radius:999px;background:var(--surface2);color:var(--muted)}
.tag.multi{background:var(--warn-soft);color:var(--warn)}
.tag.flag{background:var(--warn-soft);color:var(--warn)}
.tag.pass{background:var(--good-soft);color:var(--good)}
.tag.fail{background:var(--bad-soft);color:var(--bad)}
.navgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:6px}
.navgrid button{height:34px;border-radius:6px;border:1px solid var(--line);background:var(--surface);font-family:var(--mono);font-size:.78rem;padding:0}
.navgrid button.done{background:var(--accent-soft);border-color:var(--accent)}
.navgrid button.flag{box-shadow:inset 0 -3px 0 var(--warn)}
.navgrid button.cur{outline:2px solid var(--accent);outline-offset:1px}
.navgrid button.ok{background:var(--good-soft);border-color:var(--good)}
.navgrid button.bad{background:var(--bad-soft);border-color:var(--bad)}
.timer{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:1rem;padding:6px 10px;border-radius:8px;background:var(--surface2)}
.timer.low{background:var(--bad-soft);color:var(--bad)}
.big{font-family:var(--display);font-size:3rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.result{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.result .card{align-items:flex-start}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rate button{padding:12px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:600;display:flex;flex-direction:column;gap:2px;align-items:center}
.rate button small{font-weight:400;color:var(--muted);font-size:.75rem}
.rate .r0{border-color:var(--bad);color:var(--bad)}
.rate .r1{border-color:var(--warn);color:var(--warn)}
.rate .r2{border-color:var(--good);color:var(--good)}
.rate .suggest{box-shadow:0 0 0 3px var(--accent-soft);border-width:2px}
.answer{border-top:1px dashed var(--line);padding-top:12px;display:flex;flex-direction:column;gap:6px}
.answer .a{font-weight:600;color:var(--good);white-space:pre-line}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
td.num{font-variant-numeric:tabular-nums;text-align:right}
.tablewrap{overflow-x:auto}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:8px 14px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
label.chk{display:flex;gap:8px;align-items:center;font-weight:500}
.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}
.note{font-size:.85rem;color:var(--muted)}
.ver{text-align:center;font-family:var(--mono);font-size:.7rem;color:var(--muted);padding:8px 16px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30;display:flex;align-items:flex-end;justify-content:center;padding:0}
.modal{background:var(--surface);color:var(--fg);border-radius:14px 14px 0 0;width:100%;max-width:860px;max-height:88vh;overflow:auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
@media (min-width:700px){.modal-bg{align-items:center;padding:20px}.modal{border-radius:14px;max-height:80vh}}
.modal .text{font-size:1.05rem;line-height:1.45}
.expl{border-left:4px solid var(--accent);background:var(--surface2);border-radius:0 10px 10px 0;padding:12px 14px;display:flex;flex-direction:column;gap:8px;line-height:1.5}
.expl .memo{background:var(--warn-soft);color:var(--fg);border-radius:8px;padding:8px 10px;font-weight:600}
.expl .src{font-size:.78rem;color:var(--muted)}
.expl .lo{font-size:.85rem;display:flex;flex-direction:column;gap:2px}.expl .lo b{color:var(--accent);font-variant-numeric:tabular-nums}
.expl .doubt{color:var(--bad);font-weight:600}
.memos{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.memos .m{background:var(--surface2);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.memos .m b{color:var(--accent)}
.modal .lbl{font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.modal .yours{color:var(--bad)}.modal .yours.ok{color:var(--good)}
.modal .corr{color:var(--good)}
.modal .ans{white-space:pre-line;font-weight:600}
.greet{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.greet .hello{font-family:var(--display);font-size:1.5rem;font-weight:700;line-height:1.15}
.greet .quote{color:var(--muted);font-style:italic}
.mascot{display:flex;align-items:center;gap:12px}
.masc-btn{background:none;border:0;padding:0;flex:none;line-height:0;border-radius:12px}
.masc-bubble{position:relative;flex:1;min-width:0;background:var(--surface2);border-radius:12px;padding:8px 12px 10px}
.masc-bubble::before{content:"";position:absolute;left:-7px;top:50%;margin-top:-7px;border:7px solid transparent;border-left:0;border-right-color:var(--surface2)}
.masc-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.masc-off,.masc-on{padding:2px 6px!important;font-size:.75rem}
.masc-on{align-self:flex-start}
.masc-say{font-weight:500;text-wrap:pretty}
.mood-risk .masc-bubble,.mood-late .masc-bubble,.mood-lost .masc-bubble{background:var(--warn-soft)}
.mood-risk .masc-bubble::before,.mood-late .masc-bubble::before,.mood-lost .masc-bubble::before{border-right-color:var(--warn-soft)}
.mood-proud .masc-bubble{background:var(--good-soft)}
.mood-proud .masc-bubble::before{border-right-color:var(--good-soft)}
.masc .cloud{fill:#fff;stroke:#b9c4d0;stroke-width:2.5;stroke-linejoin:round}
.masc.m-ok .cloud{fill:#f1f5f9}
.masc.m-sad .cloud{fill:#d3dbe5;stroke:#9aa7b5}
.masc.m-weep .cloud{fill:#a9b4c1;stroke:#7d8996}
.masc .m-eyes ellipse{fill:#1d2733;transform-box:fill-box;transform-origin:center;animation:m-blink 4.5s infinite}
.masc .mouth,.masc .brow{fill:none;stroke:#1d2733;stroke-width:3;stroke-linecap:round}
.masc .cheek{fill:#f59aa0;opacity:0;transition:opacity .2s}
.masc.m-happy .cheek,.f-blush .masc .cheek{opacity:.8}
.masc .shine{fill:#fff}
.masc .wink{display:none;fill:none;stroke:#1d2733;stroke-width:3;stroke-linecap:round}
.masc .oh{display:none;fill:#1d2733}
.f-wink .masc .eyeR,.f-wink .masc .shine:nth-of-type(2){display:none}
.f-wink .masc .wink{display:block}
.f-oh .masc .mouth{display:none}
.f-oh .masc .oh{display:block}
.masc .m-tear{fill:#4a90d9;animation:m-tear 2.4s ease-in infinite}
.masc .m-tear.t2{animation-delay:1.1s}
.masc .m-body{animation:m-bob 3.2s ease-in-out infinite}
.masc.m-happy .m-body{animation:m-bounce 1.3s ease-in-out infinite}
.masc.m-sad .m-body,.masc.m-weep .m-body{animation:m-droop 3.6s ease-in-out infinite}
.masc .m-sun circle{fill:#f6c343}
.masc .m-sun path{stroke:#f6c343;stroke-width:3;stroke-linecap:round}
.masc .m-sun{transform-origin:78px 22px;animation:m-spin 12s linear infinite}
.masc .m-spark path{fill:#f6c343;transform-box:fill-box;transform-origin:center;animation:m-twinkle 1.8s ease-in-out infinite}
.masc .m-rain path{stroke:#4a90d9;stroke-width:3;stroke-linecap:round;animation:m-rain .9s linear infinite}
.masc .m-rain path:nth-child(2){animation-delay:.3s}
.masc .m-rain path:nth-child(3){animation-delay:.6s}
.r-hop .masc{animation:m-hop .6s ease}
.r-spin .masc{animation:r-spin .8s ease}
.r-shake .masc{animation:r-shake .5s linear}
.r-squish .masc{animation:r-squish .6s ease;transform-origin:50% 90%}
.r-flip .masc{animation:r-flip .9s ease}
.r-puff .masc{animation:r-puff .7s ease}
.r-wobble .masc{animation:r-wobble .9s ease;transform-origin:50% 90%}
.r-dodge .masc{animation:r-dodge .8s ease}
.r-float .masc{animation:r-float 1.2s ease}
@keyframes m-bob{50%{transform:translateY(-3px)}}
@keyframes m-bounce{0%,100%{transform:translateY(0)}40%{transform:translateY(-7px)}60%{transform:translateY(-5px)}}
@keyframes m-droop{0%,100%{transform:translateY(0)}50%{transform:translateY(2.5px) scaleY(.98)}}
@keyframes m-tear{0%,35%{transform:translateY(0);opacity:0}45%{opacity:1}100%{transform:translateY(20px);opacity:0}}
@keyframes m-blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes m-spin{to{transform:rotate(360deg)}}
@keyframes m-twinkle{50%{transform:scale(.4);opacity:.3}}
@keyframes m-rain{0%{transform:translateY(-3px);opacity:0}30%{opacity:1}100%{transform:translateY(9px);opacity:0}}
@keyframes r-spin{to{transform:rotate(360deg)}}
@keyframes r-shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@keyframes r-squish{30%{transform:scale(1.25,.7)}60%{transform:scale(.85,1.2)}}
@keyframes r-flip{50%{transform:rotateY(180deg)}100%{transform:rotateY(360deg)}}
@keyframes r-puff{40%{transform:scale(1.3)}70%{transform:scale(.92)}}
@keyframes r-wobble{20%{transform:rotate(-14deg)}45%{transform:rotate(11deg)}70%{transform:rotate(-6deg)}}
@keyframes r-dodge{30%{transform:translateX(14px) rotate(8deg)}65%{transform:translateX(-8px) rotate(-5deg)}}
@keyframes r-float{40%{transform:translateY(-16px)}70%{transform:translateY(-12px)}}
@keyframes m-hop{30%{transform:translateY(-10px) rotate(-6deg)}60%{transform:translateY(0) rotate(4deg)}}
@media (prefers-reduced-motion:reduce){.masc *,.masc{animation:none!important}.masc .m-tear{opacity:1}}
.name-in{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);min-width:0;width:160px}
.goal{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.searchbox{display:flex;flex-direction:column;gap:8px;border-top:1px dashed var(--line);padding-top:10px}
.pace{font-size:.8rem}
.pics{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.fig{position:relative;margin:0;flex:1 1 260px;max-width:100%;display:flex;align-items:center;justify-content:center;min-height:120px;padding:10px;border-radius:12px;border:1px solid var(--line);background:#fff;cursor:zoom-in;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.06),0 8px 24px -12px rgba(0,0,0,.25);transition:transform .15s ease,box-shadow .15s ease;-webkit-tap-highlight-color:transparent}
.fig:active{transform:scale(.985)}
@media (hover:hover){.fig:hover{box-shadow:0 1px 2px rgba(0,0,0,.08),0 14px 32px -12px rgba(0,0,0,.35)}}
.fig::before{content:"";position:absolute;inset:0;background:linear-gradient(100deg,#eef1f4 30%,#f8fafb 50%,#eef1f4 70%);background-size:200% 100%;animation:shim 1.2s linear infinite;transition:opacity .3s}
.fig.ready::before{opacity:0;animation:none}
@keyframes shim{to{background-position:-200% 0}}
.fig img{position:relative;display:block;max-width:100%;max-height:min(46vh,440px);width:auto;height:auto;object-fit:contain;opacity:0;transform:scale(.985);transition:opacity .3s ease,transform .3s ease}
.fig.ready img{opacity:1;transform:none}
.fig .mag{position:absolute;right:8px;bottom:8px;width:30px;height:30px;border-radius:50%;background:rgba(15,23,32,.72);color:#fff;display:grid;place-items:center;opacity:0;transition:opacity .3s;pointer-events:none}
.fig.ready .mag{opacity:1}
.fig .mag svg{width:15px;height:15px}
.pics.thumbs{justify-content:flex-start}
.pics.thumbs .fig{flex:0 0 auto;min-height:60px;padding:6px;border-radius:8px;box-shadow:none;cursor:inherit}
.pics.thumbs .fig img{max-height:96px}
.pics.thumbs .mag{display:none}
.zoomer{position:fixed;inset:0;z-index:40;background:rgba(6,10,14,.9);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);display:flex;opacity:0;transition:opacity .2s ease;touch-action:none;overscroll-behavior:contain}
.zoomer.on{opacity:1}
.zoomer .stage{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:calc(56px + env(safe-area-inset-top,0px)) 14px calc(44px + env(safe-area-inset-bottom,0px))}

  late:['Es ist spät. Die Streak von {n} Tagen stirbt um Mitternacht. Aber du hattest sicher Wichtigeres.', 'Der Tag ist fast rum. Null Fragen. Ich sage das ganz ohne Vorwurf.', 'Geh ruhig schlafen. Ich halte hier die Totenwache für die Streak.', 'Mit der Einstellung wirst du höchstens Flap Operator.', 'Mein Flugzeug. Du schaust heute nur zu, oder wie?', 'Du bist hinter dem Flugzeug. Weit dahinter. Noch am Parkplatz.', 'Go around. So ist der Tag nicht landbar.'],

  lost:['{m} jours. Mais qui compte. Moi. Je compte.', 'C’est gentil de passer. Non, vraiment.', 'La série est perdue. Ce n’était que l’œuvre de ma vie.', 'Tes camarades révisent en ce moment. Simple TAF.', 'Ah, tu es vivant. La série, non.', 'Tout va bien. Je me suis habitué au silence.', 'Avec cette attitude, tu feras un très bon opérateur de volets.', 'J’ai les commandes. Tu regardes seulement aujourd’hui ?', 'Tu es derrière l’avion. Loin derrière. Encore sur le parking.', 'Remise de gaz. Cette journée n’est pas posable comme ça.', 'J’ai vu des passagers mieux préparés.', 'Piloter, naviguer, communiquer. Et avant tout ça : réviser.', 'Qu’est-ce que tu fais ? Question rhétorique. Je le vois bien. Rien.', 'Le train ne sort pas tout seul et les questions ne s’apprennent pas toutes seules.', 'Check-list révision : point un, commencer. Non coché.', 'La vitesse, c’est la vie. L’altitude, c’est l’assurance vie. Et réviser, c’est tout le reste.', 'Tu pilotes ou tu subis ? Aujourd’hui, tu subis.', 'Un bon pilote est un vieux pilote. À ce rythme, tu vas rester jeune longtemps.', 'Mieux vaut être au sol en regrettant de ne pas voler que l’inverse. Mais au sol, on révise.', 'Et la bille ? Et les questions ? Rien n’est au milieu.', 'On n’est pas passager de sa propre formation.', 'Zéro question. Même la manche à air travaille plus que toi.', 'Tu es tellement derrière l’avion que tu ne serais même pas blessé à l’impact.'],

function mascot(today, goal, st) {

  const txt = () => lines[mascPick % lines.length].replace('{n}', st).replace('{r}', Math.max(0, goal - today)).replace('{g}', goal).replace('{m}', mascMissed());
  const say = h('div', {class:'masc-say', 'aria-live':'polite'}, txt());
  const fig = h('button', {class:'masc-btn', title: M.tap, 'aria-label': 'Grummulus. ' + M.tap, onclick: () => {
    const sadMood = today === 0, quips = sadMood ? M.tapSad : M.tapOk, rnd = a => a[Math.floor(Math.random() * a.length)];
    if (Math.random() < .55) { let q; do { q = rnd(quips); } while (quips.length > 1 && q === say.textContent); say.textContent = q; } else { mascPick += 1 + Math.floor(Math.random() * (lines.length - 1 || 1)); say.textContent = txt(); }
    const moves = ['r-hop', 'r-spin', 'r-shake', 'r-squish', 'r-flip', 'r-puff', 'r-wobble', 'r-dodge', 'r-float'], faces = ['', 'f-wink', 'f-oh', 'f-blush', 'f-oh', 'f-wink'];
    let mv; do { mv = rnd(moves); } while (mv === fig.dataset.mv); fig.dataset.mv = mv;
    fig.className = 'masc-btn'; void fig.offsetWidth; fig.className = 'masc-btn ' + mv + ' ' + rnd(faces);
    clearTimeout(fig._t); fig._t = setTimeout(() => { fig.className = 'masc-btn'; }, 1400);
  }});
  fig.innerHTML = mascSvg(mood);
  return h('div', {class:'mascot mood-' + mood}, fig,
    h('div', {class:'masc-bubble'}, h('div', {class:'masc-head'}, h('span', {class:'eyebrow'}, 'Grummulus'), h('button', {class:'btn-g masc-off', onclick: () => mascSet(false)}, M.off)), say));
}
