<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no"><link rel="manifest" href="manifest.webmanifest"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Luftraum 3D"><link rel="apple-touch-icon" href="icons/icon-180.png"><link rel="icon" href="icons/icon-192.png"><meta name="theme-color" content="#0b6e8f"><style>[hidden]{display:none!important}img{max-width:100%}</style></head><body><title>Luftraum Deutschland 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: full-height 3D canvas; top bar with quick views; right drawer (tablet/desktop) or bottom sheet (phone) with zone list and data */
:root{
  --bg:#eef2f6; --surface:#ffffff; --surface2:#e9edf3; --fg:#17202b; --muted:#5b6876; --line:#d3dae3; --accent:#0b6e8f; --accent-fg:#fff;

}

:root[data-theme="dark"]{--bg:#0f151c;--surface:#18212b;--surface2:#222d39;--fg:#e8edf2;--muted:#93a1b1;--line:#2d3a48;--accent:#4fb3d6;--accent-fg:#0b1218;--sky:#1a2634;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 var(--body);overflow:hidden;-webkit-user-select:none;user-select:none}
#stage{position:absolute;inset:0;touch-action:none}
canvas{display:block}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
h1{font-family:var(--display);font-size:1.15rem;margin:0;line-height:1.1;white-space:nowrap}
h2{font-family:var(--display);font-size:1.35rem;margin:0;line-height:1.15;display:flex;align-items:center;gap:10px}
.sw{width:16px;height:16px;border-radius:4px;border:1px solid rgba(0,0,0,.2);flex:none}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.muted{color:var(--muted);font-size:.9rem}
/* top bar */
.top{position:absolute;top:env(safe-area-inset-top,0px);left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));margin-top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;pointer-events:none}
.top>*{pointer-events:auto}
.pill{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 14px;box-shadow:0 4px 14px rgba(0,0,0,.12);display:flex;gap:6px;align-items:center}

.views::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-weight:600;font-size:.88rem;white-space:nowrap;min-height:38px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}

.drawer.closed{transform:translateX(calc(100% + 24px))}
.drawer .head{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.drawer .head .tabs{display:flex;gap:4px;flex:1}
.drawer .body{overflow:auto;padding:14px;display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch}
.fab{position:absolute;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--accent);color:var(--accent-fg);border:0;border-radius:999px;padding:12px 18px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.25);display:none}
.drawer.closed ~ .fab{display:block}
@media (max-width:760px){
  .drawer{top:auto;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));width:auto;height:52%;bottom:calc(10px + env(safe-area-inset-bottom,0px))}

}

.zone.sel{border-color:var(--accent);background:var(--surface2)}
.zone .n{flex:1;min-width:0;font-weight:600;line-height:1.2}
.zone .cls{font-family:var(--mono);font-size:.75rem;color:var(--muted)}
.zone .eye{border:0;background:none;color:var(--muted);font-size:1rem;padding:6px}

dt{color:var(--muted);font-weight:500}
dd{margin:0;font-variant-numeric:tabular-nums}

.row{display:flex;gap:8px;flex-wrap:wrap}
.hint{font-size:.82rem;color:var(--muted)}

geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3)); geo.computeVertexNormals();
scene.add(new THREE.Mesh(geo, new THREE.MeshLambertMaterial({vertexColors: true})));

// Flughaefen: Pisten
function runway(xkm, len) { const m = new THREE.Mesh(new THREE.BoxGeometry(len, 0.2, 0.9), new THREE.MeshLambertMaterial({color: 0x444a52})); m.position.set(X(xkm), 0.3, 0); scene.add(m); }
runway(72.5, 7); runway(135.5, 5); runway(155, 2.5); runway(172.5, 3);

// Hoehenlinien FL 100 / FL 660 als Gitter am Rand
function altLine(ft, label) {
  const g = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-100, ALT(ft), -40), new THREE.Vector3(100, ALT(ft), -40)]);
  const l = new THREE.Line(g, new THREE.LineDashedMaterial({color: 0x556677, dashSize: 2, gapSize: 1.5})); l.computeLineDistances(); scene.add(l);
  scene.add(textSprite(label, 0x556677, 7).translateX(-104).translateY(ALT(ft)).translateZ(-40));
}
function textSprite(text, color, size = 10) {
  const c = document.createElement('canvas'); const ctx = c.getContext('2d');
  ctx.font = '600 48px Barlow Semi Condensed, Arial'; const w = ctx.measureText(text).width + 24; c.width = w; c.height = 64;
  ctx.font = '600 48px Barlow Semi Condensed, Arial'; ctx.fillStyle = '#' + new THREE.Color(color).getHexString(); ctx.textBaseline = 'middle'; ctx.fillText(text, 12, 32);
  const t = new THREE.CanvasTexture(c); t.minFilter = THREE.LinearFilter;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({map: t, transparent: true, depthTest: false}));
  s.scale.set(size * w / 64, size, 1); return s;
}
altLine(10000, 'FL 100'); altLine(66000, 'FL 660'); altLine(2500, '2500 ft AGL'); altLine(5000, '5000 ft AMSL');

// Volumen
const meshes = [], byLayer = {};
for (const v of VOLS) {
  const w = v.x[1] - v.x[0], hgt = ALT(v.y[1]) - ALT(v.y[0]), d = v.z[1] - v.z[0];
  const g = new THREE.BoxGeometry(w, hgt, d);
  const m = new THREE.Mesh(g, new THREE.MeshLambertMaterial({color: v.color, transparent: true, opacity: v.op, depthWrite: false}));
  m.position.set(X((v.x[0] + v.x[1]) / 2), (ALT(v.y[0]) + ALT(v.y[1])) / 2, (v.z[0] + v.z[1]) / 2);
  m.userData = v; m.renderOrder = 1;
  const edges = new THREE.LineSegments(new THREE.EdgesGeometry(g), new THREE.LineBasicMaterial({color: v.color, transparent: true, opacity: v.wire ? .9 : .5}));
  m.add(edges);
  const lbl = textSprite(v.cls, v.color, v.cls.length > 3 ? 7 : 10); lbl.position.set(0, hgt / 2 - 2, d / 2 + 0.5); m.add(lbl);
  scene.add(m); meshes.push(m); (byLayer[v.layer] = byLayer[v.layer] || []).push(m);
}

/* ---------- UI ---------- */
const drawer = document.getElementById('drawer'), body = document.getElementById('body'), tip = document.getElementById('tip');
let tab = 'list', selected = null;
const VIEWS = [
  ['Übersicht', [-60, 120, 210], [0, 25, 0]],
  ['Von vorn', [0, 60, 230], [0, 30, 0]],
  ['Flughafen', [-10, 45, 90], [X(72), 12, 0]],
  ['TMZ + CTR', [20, 35, 70], [X(136), 8, 0]],
  ['Alpen', [40, 60, 90], [X(185), 20, 0]],
  ['Von oben', [0, 320, 1], [0, 0, 0]],
];
let flight = null;
function flyTo(pos, target) { flight = {p0: camera.position.clone(), t0: controls.target.clone(), p1: new THREE.Vector3(...pos), t1: new THREE.Vector3(...target), s: performance.now()}; }
function resetView() { camera.position.set(...VIEWS[0][1]); controls.target.set(...VIEWS[0][2]); controls.update(); }
const viewsEl = document.getElementById('views');
VIEWS.forEach(([name, p, t], k) => { const b = document.createElement('button'); b.className = 'chip'; b.textContent = name; b.setAttribute('aria-pressed', k === 0); b.onclick = () => { for (const c of viewsEl.children) c.setAttribute('aria-pressed', c === b); flyTo(p, t); }; viewsEl.append(b); });

for (const id of ['list', 'info', 'help']) document.getElementById('tab-' + id).onclick = () => { tab = id; renderBody(); };
document.getElementById('btn-close').onclick = () => drawer.classList.add('closed');
document.getElementById('fab').onclick = () => drawer.classList.remove('closed');
if (window.innerWidth < 760) drawer.classList.add('closed');

function renderBody() {
  for (const id of ['list', 'info', 'help']) document.getElementById('tab-' + id).setAttribute('aria-pressed', tab === id);
  body.innerHTML = '';
  if (tab === 'list') {
    body.append(el('div', 'hint', 'Antippen zeigt die Daten und fliegt die Kamera hin. Das Auge blendet die Zone aus.'));
    const row = el('div', 'row'); row.append(btn('Alle einblenden', () => meshes.forEach(m => { m.visible = true; }) || renderBody()), btn('Nur Bodenzonen', () => { meshes.forEach(m => { m.visible = !['C','E','G'].includes(m.userData.layer); }); renderBody(); })); body.append(row);
    const list = el('div', 'zones');
    for (const m of meshes) {
      const v = m.userData;
      const z = el('button', 'zone' + (m === selected ? ' sel' : '')); const sw = el('span', 'sw'); sw.style.background = '#' + new THREE.Color(v.color).getHexString();
      const n = el('span', 'n', v.name); n.append(el('span', 'cls', ' ' + v.cls));
      const eye = el('button', 'eye', m.visible ? '👁' : '🚫'); eye.setAttribute('aria-pressed', m.visible); eye.title = 'Ein-/ausblenden';
      eye.onclick = ev => { ev.stopPropagation(); m.visible = !m.visible; eye.textContent = m.visible ? '👁' : '🚫'; eye.setAttribute('aria-pressed', m.visible); };
      z.append(sw, n, eye); z.onclick = () => { select(m, true); };
      list.append(z);
    }
    body.append(list);
  } else if (tab === 'info') {
    if (!selected) { body.append(el('h2', '', 'Keine Zone gewählt'), el('div', 'muted', 'Tippe im 3D Bild auf ein Volumen oder wähle eine Zone aus der Liste.')); return; }
    const v = selected.userData;
    const h2 = el('h2'); const sw = el('span', 'sw'); sw.style.background = '#' + new THREE.Color(v.color).getHexString(); h2.append(sw, v.name);
    body.append(el('div', 'eyebrow', 'Luftraumklasse ' + v.cls), h2);
    const dl = document.createElement('dl');
    for (const [k, val] of Object.entries(v.data)) { dl.append(el('dt', '', k), el('dd', '', val)); }
    body.append(dl);
    const row = el('div', 'row'); row.append(btn('Kamera hinfliegen', () => focusOn(selected)), btn('Nur diese Zone zeigen', () => { meshes.forEach(m => { m.visible = m === selected; }); }), btn('Auswahl aufheben', () => { select(null); tab = 'list'; renderBody(); }));
    body.append(row);
  } else {
    body.append(el('h2', '', 'Bedienung'),
      el('div', 'muted', 'iPad und Handy: ein Finger drehen, zwei Finger zoomen (Pinch) oder verschieben. Kurz antippen wählt eine Zone. Rechner: linke Maustaste drehen, Mausrad zoomen, rechte Maustaste verschieben.'),
      el('div', 'muted', 'Schnellansichten oben springen zu Flughafen, TMZ, Alpen oder zur Draufsicht. Die Zonenliste ist der einfachste Weg zu den Daten, die kleinen Volumen sind im Bild schwer zu treffen.'),
      el('div', 'muted', 'Die Höhenachse ist 3-fach überhöht. Beispielhöhen nach DFS Schema 08/2016, Stand und Details im AIP und SERA.5001 prüfen.'),
      el('div', 'eyebrow', 'Farben'));
    const leg = el('div', 'zones');
    for (const [id, name, col] of LAYERS) { const z = el('div', 'zone'); const sw = el('span', 'sw'); sw.style.background = '#' + new THREE.Color(col).getHexString(); z.append(sw, el('span', 'n', name)); leg.append(z); }
    body.append(leg);
  }
}
function el(t, c, txt) { const e = document.createElement(t); if (c) e.className = c; if (txt != null) e.textContent = txt; return e; }
function btn(txt, fn) { const b = el('button', 'btn-s', txt); b.onclick = fn; return b; }
function focusOn(m) {
  const v = m.userData, c = m.position, size = Math.max(v.x[1]-v.x[0], ALT(v.y[1])-ALT(v.y[0]), v.z[1]-v.z[0]);
  const dist = Math.max(30, size * 1.6);
  flyTo([c.x - dist * .55, c.y + dist * .6, c.z + dist * .9], [c.x, c.y, c.z]);
}
function select(m, fly) {
  if (selected) { selected.material.opacity = selected.userData.op; selected.material.emissive.setHex(0); }
  selected = m;
  if (m) { m.material.opacity = Math.min(.8, m.userData.op + .35); m.material.emissive.setHex(0x333333); if (fly) focusOn(m); tab = 'info'; drawer.classList.remove('closed'); }
  renderBody();
}
renderBody();

/* ---------- Auswahl im Bild ---------- */
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
let downAt = null;
function pick(ev) {
  const r = renderer.domElement.getBoundingClientRect();
  ptr.x = ((ev.clientX - r.left) / r.width) * 2 - 1; ptr.y = -((ev.clientY - r.top) / r.height) * 2 + 1;
  ray.setFromCamera(ptr, camera);
  const hits = ray.intersectObjects(meshes.filter(m => m.visible), false);
  if (!hits.length) return null;
  hits.sort((a, b) => vol(a.object) - vol(b.object));
  return hits[0].object;
}
function vol(m) { const v = m.userData; return (v.x[1]-v.x[0]) * (v.y[1]-v.y[0]) * (v.z[1]-v.z[0]); }
renderer.domElement.addEventListener('pointerdown', e => { downAt = [e.clientX, e.clientY, Date.now()]; });
renderer.domElement.addEventListener('pointerup', e => {
  if (!downAt) return; const moved = Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]); const dt = Date.now() - downAt[2]; downAt = null;
  if (moved > 8 || dt > 700) return;
  const m = pick(e); if (m) select(m, false); else if (selected) { select(null); }
});
renderer.domElement.addEventListener('pointermove', e => {
  if (e.pointerType !== 'mouse') return;
  const m = pick(e); renderer.domElement.style.cursor = m ? 'pointer' : 'grab';
  if (m) { tip.textContent = m.userData.name; tip.style.left = e.clientX + 'px'; tip.style.top = e.clientY + 'px'; tip.style.opacity = 1; } else tip.style.opacity = 0;
});

/* ---------- Loop ---------- */
function resize() { const w = stage.clientWidth, h = stage.clientHeight; camera.aspect = w / h; camera.updateProjectionMatrix(); renderer.setSize(w, h); }
window.addEventListener('resize', resize); resize();
(function loop() { requestAnimationFrame(loop);
  if (flight) { const t = Math.min(1, (performance.now() - flight.s) / 900), e = t < .5 ? 2*t*t : -1 + (4 - 2*t) * t;
    camera.position.lerpVectors(flight.p0, flight.p1, e); controls.target.lerpVectors(flight.t0, flight.t1, e); if (t >= 1) flight = null; }
  controls.update(); renderer.render(scene, camera); })();
})();
</script>
